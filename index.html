<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de clima</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="Insira o nome da cidade" spellcheck="false">
            <button><img src="https://cdn-icons-png.flaticon.com/128/3991/3991270.png"></button>
        </div>
        <div class="error">
            <p>Nome inválido</p>
        </div>
        <div class="weather">
            <img src="https://cdn-icons-png.flaticon.com/128/12607/12607703.png" class="weather-icon">
            <h1 class="temp">22°c</h1>
            <h2 class="city">São Paulo</h2>
            <div class="details">
                <div class="col">
                    <img src="https://cdn-icons-png.flaticon.com/128/5664/5664993.png">
                    <div>
                        <p class="humidity">50%</p>
                        <p>Humidade</p>
                    </div>
                </div>
                <div class="col">
                    <img src="https://cdn-icons-png.flaticon.com/128/5024/5024369.png">
                    <div>
                        <p class="wind">15 km/h</p>
                        <p>Velocidade do vento</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>

// adicionar chave API
const apiKey = "API KEY";
const apiUrl = "https://api.openweathermap.org/data/2.5/weather?units=metric&q=";

const searchBox = document.querySelector(".search input");
const searchBtn = document.querySelector(".search button");
const weatherIcon = document.querySelector(".weather-icon");

async function checkWeather(city){
    const response = await fetch(apiUrl + city + `&appid=${apiKey}`);

    if(response.status == 404){
        document.querySelector(".error").style.display = "block";
        document.querySelector(".weather").style.display = "none";
    }else{

        var data = await response.json();

        document.querySelector(".city").innerHTML = data.name;
        document.querySelector(".temp").innerHTML = Math.round(data.main.temp) + "°c";
        document.querySelector(".humidity").innerHTML = data.main.humidity + "%";
        document.querySelector(".wind").innerHTML = data.wind.speed + "km/h";

        if(data.weather[0].main == "Clouds"){
            weatherIcon.src = "https://cdn-icons-png.flaticon.com/128/13622/13622240.png";
        }
        else if(data.weather[0].main == "Clear"){
            weatherIcon.src = "https://cdn-icons-png.flaticon.com/128/11742/11742559.png";
        }
        else if(data.weather[0].main == "Rain"){
            weatherIcon.src = "https://cdn-icons-png.flaticon.com/128/9755/9755210.png";
        }
        else if(data.weather[0].main == "Drizzle"){
            weatherIcon.src = "https://cdn-icons-png.flaticon.com/128/4834/4834677.png";
        }
        else if(data.weather[0].main == "Mist"){
            weatherIcon.src = "https://cdn-icons-png.flaticon.com/128/16273/16273827.png";
        }

        document.querySelector(".weather").style.display = "block";
        document.querySelector(".error").style.display = "none";
    }
}

searchBtn.addEventListener("click", ()=>{
    checkWeather(searchBox.value);
})

</script>

</body>
</html>
